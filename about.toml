# cargo-about config for G12: license notices of every Rust crate in the release.
# Generate with: cargo about generate --workspace about.hbs -o build-assets/THIRD-PARTY-CRATES.txt
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    # malachite-base / malachite-nz (inherited from Kaspa via kaspa-math; used for
    # the MuHash modular inverse). LGPL-3.0: we ship its license text and the full
    # source of Zethora is public, so users can rebuild with a modified copy.
    # CTO decision 2026-10-27; get a lawyer to confirm before mainnet.
    "LGPL-3.0-only",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
