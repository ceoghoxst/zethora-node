[package]
name = "zethora-wallet"
description = "Zethora testnet wallet CLI: balance, receive, send (Testnet Phase 2)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zethora-wallet"
path = "src/main.rs"

# The ledger lives in its own crate root as well as being a module of the binary: the integration tests in
# tests/history.rs link against the library, and a binary target cannot be imported. Same file, two targets.
[lib]
name = "zethora_wallet"
path = "src/history.rs"

[dependencies]
kaspa-addresses.workspace = true
kaspa-consensus-core.workspace = true
kaspa-grpc-client.workspace = true
kaspa-rpc-core.workspace = true
kaspa-txscript.workspace = true
secp256k1.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
