name: Build and upload assets
on:
  push:
    tags:
      - 'v*.*.*-testnet.*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Fix CRLF
        run: git config --global core.autocrlf false

      - name: Checkout sources
        uses: actions/checkout@v3

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Build Outputs
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build on Windows
        shell: bash
        run: |
          cargo build --bin kaspad --release
          cargo build --release -p zethora-miner
          mkdir -p bin
          cp target/release/kaspad.exe bin/zethora-node.exe
          cp target/release/zethora-miner.exe bin/
          cp build-assets/README.txt bin/
          cp build-assets/LICENSE.txt bin/
          cp build-assets/THIRD-PARTY-NOTICES.txt bin/
          cd bin
          sha256sum zethora-node.exe zethora-miner.exe README.txt LICENSE.txt THIRD-PARTY-NOTICES.txt > SHA256SUMS.txt
          cd ..
          archive="zethora-windows-x64-${{ github.ref_name }}.zip"
          (cd bin && 7z a -tzip "../${archive}" *)
          echo "archive=${archive}" >> $GITHUB_ENV

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./${{ env.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}