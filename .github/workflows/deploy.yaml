name: Build and upload assets
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*-testnet.*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Fix CRLF
        run: git config --global core.autocrlf false

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Build Outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build on Windows
        shell: bash
        run: |
          cargo build --bin kaspad --release
          cargo build --release -p zethora-miner
          cargo build --release -p zethora-wallet
          mkdir -p bin
          cp target/release/kaspad.exe bin/zethora-node.exe
          cp target/release/zethora-miner.exe bin/
          cp target/release/zethora-wallet.exe bin/
          cp build-assets/README.txt bin/
          cp build-assets/LICENSE.txt bin/
          cp build-assets/THIRD-PARTY-NOTICES.txt bin/
          cp build-assets/THIRD-PARTY-CRATES.txt bin/
          cp build-assets/Start-Zethora.cmd bin/
          cp build-assets/Stop-Zethora.cmd bin/
          cp build-assets/Zethora.cmd bin/
          cp build-assets/Zethora.ps1 bin/
          cd bin
          sha256sum zethora-node.exe zethora-miner.exe zethora-wallet.exe README.txt LICENSE.txt THIRD-PARTY-NOTICES.txt THIRD-PARTY-CRATES.txt Start-Zethora.cmd Stop-Zethora.cmd Zethora.cmd Zethora.ps1 > SHA256SUMS.txt
          cd ..
          archive="zethora-windows-x64-${{ github.ref_name }}.zip"
          (cd bin && 7z a -tzip "../${archive}" *)
          echo "archive=${archive}" >> $GITHUB_ENV

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $ver = "${{ github.ref_name }}".TrimStart('v')
          & $iscc "/DAppVersion=$ver" build-assets\zethora.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $setup = "Zethora-Setup-$ver.exe"
          (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() + "  " + $setup | Out-File -Encoding ascii "$setup.sha256"
          "setup=$setup" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Upload Windows release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./${{ env.archive }}
            ./${{ env.setup }}
            ./${{ env.setup }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Cargo Build Outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-musl-${{ hashFiles('**/Cargo.lock') }}

      - name: Build on Linux (musl)
        run: |
          cargo build --bin kaspad --release --target x86_64-unknown-linux-musl
          cargo build --release -p zethora-miner --target x86_64-unknown-linux-musl
          cargo build --release -p zethora-wallet --target x86_64-unknown-linux-musl
          mkdir -p bin-linux
          cp target/x86_64-unknown-linux-musl/release/kaspad bin-linux/zethora-node
          cp target/x86_64-unknown-linux-musl/release/zethora-miner bin-linux/
          cp target/x86_64-unknown-linux-musl/release/zethora-wallet bin-linux/
          cd bin-linux
          sha256sum zethora-node zethora-miner zethora-wallet > SHA256SUMS.txt
          cd ..
          archive="zethora-linux-x64-${{ github.ref_name }}.tar.gz"
          tar -czvf ${archive} -C bin-linux .
          echo "archive=${archive}" >> $GITHUB_ENV

      - name: Upload Linux release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./${{ env.archive }}
            ./bin-linux/zethora-node
            ./bin-linux/zethora-miner
            ./bin-linux/zethora-wallet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}